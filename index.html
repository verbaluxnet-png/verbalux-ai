<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verbalux AI | VIP Voice Concierge</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0052FF;
            --secondary: #0A192F;
            --bg-light: #F4F7FB;
            --white: #FFFFFF;
            --text-dark: #1E293B;
            --text-muted: #64748B;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-dark); line-height: 1.6; }

        nav {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px 8%; background: var(--white); box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
        }

        .logo { font-size: 24px; font-weight: 800; color: var(--secondary); }
        .logo span { color: var(--primary); }

        .hero {
            padding: 80px 8%; text-align: center;
            background: linear-gradient(180deg, #FFFFFF 0%, #EBF2FF 100%);
        }

        .badge {
            background: #EDE9FF; color: var(--primary); padding: 6px 16px;
            border-radius: 20px; font-size: 14px; font-weight: 700; display: inline-block; margin-bottom: 20px;
        }

        .hero h1 { font-size: 42px; font-weight: 800; color: var(--secondary); margin-bottom: 15px; }
        .hero h1 span { color: var(--primary); }

        .hero p {
            font-size: 18px; color: var(--text-muted); max-width: 600px; margin: 0 auto 30px auto;
        }

        .action-card {
            max-width: 450px; margin: 0 auto; background: var(--white);
            padding: 40px 30px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .btn-voice {
            width: 100%; background: var(--primary); color: var(--white);
            padding: 18px; border: none; border-radius: 30px; font-size: 18px;
            font-weight: 700; cursor: pointer; transition: 0.3s;
            box-shadow: 0 8px 20px rgba(0, 82, 255, 0.3);
        }

        .btn-voice:hover { background: #003ECC; transform: translateY(-2px); }

        footer { text-align: center; padding: 25px; background: var(--secondary); color: var(--white); font-size: 14px; margin-top: 60px; }
    </style>
</head>
<body>

    <nav>
        <div class="logo">Verbalux <span>AI</span></div>
    </nav>

    <section class="hero">
        <span class="badge">24/7 AI VIP Voice Concierge</span>
        <h1>Welcome to <span>Verbalux AI</span></h1>
        <p>Talk directly with our VIP Voice Assistant in any language instantly.</p>

        <div class="action-card">
            <button class="btn-voice" id="start-voice-btn">🎙️ Start Voice Conversation</button>
        </div>
    </section>

    <footer>
        &copy; 2026 Verbalux AI. All rights reserved.
    </footer>

    <!-- Vapi Integration Script -->
    <script src="https://cdn.jsdelivr.net/gh/VapiAI/html-script-tag@latest/dist/assets/index.js"></script>
    <script>
      const apiKey = "YOUR_PUBLIC_KEY"; // ضع هنا Public Key من Vapi
      const assistantId = "YOUR_ASSISTANT_ID"; // ضع هنا Assistant ID من Vapi

      document.getElementById('start-voice-btn').addEventListener('click', () => {
        if (window.vapiSDK && apiKey !== "YOUR_PUBLIC_KEY") {
          window.vapiSDK.run({ apiKey: apiKey, assistant: assistantId });
        } else {
          alert('اضغط هنا لبدء المحادثة الصوتي المباشرة عبر البوت!');
        }
      });
    </script>
</body>
</html>
